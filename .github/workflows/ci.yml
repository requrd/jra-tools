name: CI

on:
  pull_request:
  # master への push 時は publish.yml から呼ばれる
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # ビューの仕組み(jra_tools.views)の結合テスト
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_database
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_database"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_POSTGRES: postgresql+psycopg://test_user:test_password@127.0.0.1:5432/test_database
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run mypy src
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      # カバレッジをジョブの概要(Summary)に出す
      - if: always() && hashFiles('coverage.xml') != ''
        run: |
          {
            echo "## カバレッジ"
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
      - run: uv build
