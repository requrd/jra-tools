name: Release

# master に push されたとき、pyproject.toml のバージョンのタグがまだなければ
# PyPI に公開し、タグと GitHub Release を作る。
on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Check whether this version is already released
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released; skipping."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.release == 'true'
        uses: astral-sh/setup-uv@v10.3.0
      - if: steps.version.outputs.release == 'true'
        run: uv build
      - if: steps.version.outputs.release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 再実行時に公開済みのファイルでエラーにしない
          skip-existing: true
      - if: steps.version.outputs.release == 'true'
        name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/*.whl dist/*.tar.gz --target "$GITHUB_SHA" --title "$TAG" --generate-notes
